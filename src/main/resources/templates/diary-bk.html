<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Diary</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <!-- ==================== HEADER ==================== -->

    <div class="mb-4">

        <h2 class="fw-bold">
            Diary
        </h2>

        <p class="text-muted mb-0">
            Lịch sử hoạt động
        </p>

    </div>


    <!-- ==================== SUBJECT ==================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="d-flex align-items-center">

                <!-- Subject code -->
                <div class="me-3">

                    <span class="badge bg-primary"
                          th:text="${subject.subjectCode}">
                        001
                    </span>

                </div>


                <!-- Subject information -->
                <div>

                    <h4 class="mb-0"
                        th:text="${subject.subjectName}">
                        Chức năng A
                    </h4>

                    <small class="text-muted">
                        Subject
                    </small>

                </div>

            </div>

        </div>

    </div>


    <!-- ==================== TIMELINE ==================== -->

    <div class="card shadow-sm">

        <div class="card-body">

            <!-- Timeline header -->
            <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-4">

                <h5 class="fw-bold mb-0">
                    Timeline
                </h5>


                <!-- Add Event button -->
                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#addEventModal">

                    + Add Event

                </button>

            </div>


            <!-- ==================== EVENT LIST ==================== -->

            <div th:each="event : ${subject.listDetail}"
                 class="d-flex mb-4">


                <!-- Timeline icon -->
                <div class="me-3">

                    <div class="rounded-circle
                                bg-primary
                                text-white
                                d-flex
                                align-items-center
                                justify-content-center"
                         style="width: 40px;
                                height: 40px;">

                        <span>●</span>

                    </div>

                </div>


                <!-- Event content -->
                <div class="flex-grow-1">

                    <!-- Event header -->
                    <div class="d-flex
                                justify-content-between
                                align-items-start">

                        <!-- Event name -->
                        <h6 class="fw-bold mb-1"
                            th:text="${event.event}">

                            Bắt đầu xử lý

                        </h6>


                        <!-- Action date -->
                        <small class="text-muted ms-3"
                               th:text="${#temporals.format(
                                   event.actionDate,
                                   'dd/MM/yyyy HH:mm:ss'
                               )}">

                            17/08/2026 09:00:00

                        </small>

                    </div>


                    <!-- Event description -->
                    <p class="text-muted mb-0"
                       th:text="${event.content}">

                        Bắt đầu thực hiện chức năng A

                    </p>

                </div>

            </div>


            <!-- ==================== NO EVENT ==================== -->

            <div th:if="${#lists.isEmpty(subject.listDetail)}"
                 class="text-center text-muted py-4">

                Chưa có sự kiện nào.

            </div>

        </div>

    </div>

</div>


<!-- ====================================================== -->
<!--                     ADD EVENT MODAL                    -->
<!-- ====================================================== -->

<div class="modal fade"
     id="addEventModal"
     tabindex="-1"
     aria-labelledby="addEventModalLabel"
     aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">


            <!-- Modal header -->
            <div class="modal-header">

                <h5 class="modal-title"
                    id="addEventModalLabel">

                    Thêm sự kiện

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>


            <!-- ==================== FORM ==================== -->

            <form th:action="@{/diary/{subjectId}/events(
                                subjectId=${subject.id}
                             )}"
                  method="post">


                <!-- Modal body -->
                <div class="modal-body">


                    <!-- Event name -->
                    <div class="mb-3">

                        <label for="event"
                               class="form-label">

                            Tên sự kiện

                        </label>

                        <input type="text"
                               class="form-control"
                               id="event"
                               name="event"
                               placeholder="Nhập tên sự kiện"
                               required>

                    </div>


                    <!-- Event description -->
                    <div class="mb-3">

                        <label for="content"
                               class="form-label">

                            Mô tả sự kiện

                        </label>

                        <textarea class="form-control"
                                  id="content"
                                  name="content"
                                  rows="4"
                                  placeholder="Nhập mô tả sự kiện"
                                  required></textarea>

                    </div>

                </div>


                <!-- Modal footer -->
                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Hủy

                    </button>


                    <button type="submit"
                            class="btn btn-primary">

                        Thêm sự kiện

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- ====================================================== -->
<!--                  BOOTSTRAP JAVASCRIPT                 -->
<!-- ====================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
