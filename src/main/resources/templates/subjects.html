<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Diary - Subjects</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">


    <!-- ================= HEADER ================= -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Diary
            </h2>

            <p class="text-muted mb-0">
                Danh sách chủ đề
            </p>

        </div>


        <button class="btn btn-primary">

            + Add Subject

        </button>

    </div>


    <!-- ================= SUBJECT LIST ================= -->

    <div class="card shadow-sm">

        <div class="card-body">


            <div class="table-responsive">

                <table class="table
                              table-hover
                              align-middle
                              mb-0">

                    <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Mã Subject
                        </th>

                        <th>
                            Tên Subject
                        </th>

                        <th>
                            Người tạo
                        </th>

                        <th>
                            Ngày tạo
                        </th>

                        <th class="text-end">
                            Action
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <!-- Subject -->
                    <tr th:each="subject : ${subjects}">

                        <td
                                th:text="${subject.id}">
                            1
                        </td>


                        <td>

                            <span class="badge bg-primary"
                                  th:text="${subject.subjectCode}">

                                001

                            </span>

                        </td>


                        <td>

                            <span class="fw-semibold"
                                  th:text="${subject.subjectName}">

                                Chức năng A

                            </span>

                        </td>


                        <td class="text-end">

                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/diary(subjectId=${subject.id})}">

                                Detail

                            </a>

                        </td>

                    </tr>


                    <!-- Empty -->
                    <tr th:if="${#lists.isEmpty(subjects)}">

                        <td colspan="6"
                            class="text-center
                                   text-muted
                                   py-5">

                            Chưa có Subject nào.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
